[project]
name = "apocrypha-backend"
version = "0.1.0"
description = "Apocrypha: backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    "redis",
    "pwdlib[argon2]>=0.3.1",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "aiosmtplib>=5.1.3",
    "rapidfuzz>=3.14.6",
    "filetype>=1.2.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "litellm>=1.106.6",
    "instructor>=1.17.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "trafilatura>=2.3.1",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# bez regul N (nazwy), bo w projekcie uzywamy camelCase
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
